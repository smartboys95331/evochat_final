workflows:
  evochat-build:
    name: EvoChat Build
    scripts:
      - name: Fix Missing Folders
        script: flutter create .
      - name: Absolute JVM Force
        script: |
          # 1. Force Gradle to use Java 17 for everything
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" >> android/gradle.properties
          
          # 2. Force every single subproject to use JVM 17 for both Java and Kotlin
          cat <<EOF >> android/build.gradle

          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
              tasks.withType(JavaCompile) {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Windows EXE
        script: flutter build windows
