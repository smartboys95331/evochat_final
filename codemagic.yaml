workflows:
  evochat-build:
    name: EvoChat Build
    scripts:
      - name: Fix Missing Folders
        script: flutter create .
      - name: Force Global JVM 17
        script: |
          # This block forces both Java and Kotlin to use JVM 17 across ALL modules and plugins
          cat <<EOF >> android/build.gradle
          
          subprojects {
              tasks.withType(JavaCompile) {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF
          # Also fix the app-level settings just in case
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' android/app/build.gradle || true
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Windows EXE
        script: flutter build windows
